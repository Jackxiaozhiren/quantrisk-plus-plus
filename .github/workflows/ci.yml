name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to an exact version, not `@v10`: setup-uv publishes no bare major tag, so a
      # major reference fails at "Set up job" with `unable to find version v10`. Verified with
      # `git ls-remote --tags`, which is the only check that matters -- the GitHub *release*
      # is called v10.2.0 either way, so reading the release name is not evidence that a ref
      # resolves. actions/checkout and actions/upload-artifact do publish major tags.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dev environment
        run: uv sync
      - name: ruff
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: clang-format
        run: |
          find cpp bindings tests/cpp -name '*.cpp' -o -name '*.hpp' | sort |
            xargs uv run clang-format --dry-run --Werror
      # Blocking. It was `|| echo "::warning::"` from Phase 1 through v1.0.0, which let 25
      # errors sit in the log permanently -- and three of them were real: a facade method that
      # raised TypeError on every documented input, and two public signatures whose `bytes`
      # annotation resolved to a dataclass field rather than the builtin. A gate that cannot
      # fail is not a gate.
      - name: mypy
        run: uv run mypy python/quantrisk

  build-and-test:
    name: Configure, build, C++ tests, Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Three guards read the repository's own history rather than its working tree: the
          # release-tag enumeration in the report, the citation's `date-released`, and the speedup
          # bands derived from every committed reading of the speed artifact. At the default depth
          # they all skipped on the runner and only ran on a laptop, which is a weaker claim than
          # the documents made. The pack is ~8 MiB over 180 commits, and the depth-1 checkout step
          # measured 1.29 s (run 38149012780), so this buys the guards their input set for seconds.
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dev environment
        run: uv sync
      - name: Configure (CMake preset ci)
        run: uv run cmake --preset ci
      - name: Build core, tests and bindings
        run: uv run cmake --build --preset ci
      - name: C++ tests (CTest)
        run: uv run ctest --preset ci
      - name: Install the Python package from the same tree
        run: uv pip install -e .
      - name: Python tests (pytest, fully offline)
        env:
          QUANTRISK_REFERENCE_TOOL: ${{ github.workspace }}/build/ci/quantrisk_reference_tool
        run: uv run pytest -q

  benchmark-suite:
    # The published artifacts in benchmarks/ and experiments/ are the evidence the README
    # and docs/validation_matrix.md quote. This job re-executes all nineteen members against
    # live oracles so that evidence cannot rot into something nothing runs.
    #
    # --require-all is the load-bearing flag. Without it a missing oracle would mark members
    # SKIPPED and the suite would still exit 0, turning "we measured everything" into a job
    # that passes by measuring nothing.
    name: Benchmark suite against live oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install with the validation oracles
        run: uv sync --extra oracles
      - name: Configure (CMake preset ci)
        run: uv run cmake --preset ci
      - name: Build core and bindings
        run: uv run cmake --build --preset ci
      - name: Install the Python package from the same tree
        run: uv pip install -e .
      - name: Run every benchmark and experiment
        run: uv run python scripts/run_benchmark_suite.py --require-all
      - name: Show the generated summary
        run: cat benchmarks/suite/results/suite_summary.md
      - name: Upload the suite artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-suite
          path: benchmarks/suite/results/
          if-no-files-found: error
