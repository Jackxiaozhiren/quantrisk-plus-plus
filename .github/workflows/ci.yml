name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to an exact version, not `@v10`: setup-uv publishes no bare major tag, so a
      # major reference fails at "Set up job" with `unable to find version v10`. Verified with
      # `git ls-remote --tags`, which is the only check that matters -- the GitHub *release*
      # is called v10.2.0 either way, so reading the release name is not evidence that a ref
      # resolves. actions/checkout and actions/upload-artifact do publish major tags.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dev environment
        run: uv sync
      - name: ruff
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: clang-format
        run: |
          find cpp bindings tests/cpp -name '*.cpp' -o -name '*.hpp' | sort |
            xargs uv run clang-format --dry-run --Werror
      # Blocking. It was `|| echo "::warning::"` from Phase 1 through v1.0.0, which let 25
      # errors sit in the log permanently -- and three of them were real: a facade method that
      # raised TypeError on every documented input, and two public signatures whose `bytes`
      # annotation resolved to a dataclass field rather than the builtin. A gate that cannot
      # fail is not a gate.
      - name: mypy
        run: uv run mypy python/quantrisk

  build-and-test:
    name: Configure, build, C++ tests, Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Four guards read the repository's own history or its tags rather than its working tree:
          # the report's release-tag enumeration, the citation's `date-released`, the speedup bands
          # derived from every committed reading of the speed artifact, and the spread percentages
          # derived from the same population. At the default depth all four skipped on the runner and
          # ran only on a laptop -- a weaker claim than the documents made. The pack is 7.93 MiB over
          # 180 commits, and the depth-1 checkout step measured 1.29 s on run 38149012780 against
          # 2.17 s at depth 0 on the probe run 38198483490, whose pytest line read
          # `432 passed, 5 skipped` where the same tree at depth 1 had read `429 passed, 8 skipped`.
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dev environment
        run: uv sync
      - name: Configure (CMake preset ci)
        run: uv run cmake --preset ci
      - name: Build core, tests and bindings
        run: uv run cmake --build --preset ci
      - name: C++ tests (CTest)
        run: uv run ctest --preset ci
      - name: Install the Python package from the same tree
        run: uv pip install -e .
      - name: Python tests (pytest, fully offline)
        env:
          QUANTRISK_REFERENCE_TOOL: ${{ github.workspace }}/build/ci/quantrisk_reference_tool
        run: uv run pytest -q

  macos-native:
    # QuantLib tests its C++ core on Linux, Windows, and macOS. QuantRisk++'s
    # existing Ubuntu jobs check the numerical oracles and frozen benchmark
    # evidence; this separate native job prevents an Ubuntu-only green build
    # from masking Apple-Clang, extension-linker, or wheel ABI regressions.
    #
    # Keep performance benchmarks on their original runner. Timings from a
    # different OS/CPU must never be compared as if they share a baseline.
    name: macOS native C++ and Python parity
    runs-on: macos-15
    timeout-minutes: 35
    env:
      # Pin native CMake binding discovery to the Python interpreter that uv
      # installed, rather than whichever Python happens to be on PATH.
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
      WHEEL_REQUIREMENTS: dist/locked-wheel.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the pinned environment with independent pricing oracles
        run: uv sync --python 3.12 --extra oracles --frozen --no-build --no-install-project
      - name: Configure native C++20 core and bindings
        run: uv run --no-build --no-sync cmake --preset ci
      - name: Build core, C++ tests, and Python extension
        run: uv run --no-build --no-sync cmake --build --preset ci --parallel 2
      - name: Run all native C++ tests
        run: uv run --no-build --no-sync ctest --preset ci
      - name: Build a local wheel from this reviewed checkout
        run: uv build --wheel --out-dir dist
      - name: SHA-256 pin the exact locally built wheel
        run: |
          uv run --no-build --no-sync python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          wheels = list(Path("dist").glob("quantrisk-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel, found {len(wheels)}")
          wheel = wheels[0].resolve()
          (Path("dist") / "locked-wheel.txt").write_text(
              f"{wheel} --hash=sha256:{sha256(wheel.read_bytes()).hexdigest()}\n",
              encoding="utf-8",
          )
          PY
      - name: Install only the verified wheel, offline and without setup scripts
        run: uv pip install --no-index --no-deps --no-build --require-hashes -r "$WHEEL_REQUIREMENTS"
      - name: Test native pricing, independent oracle, and C++/Python parity
        env:
          QUANTRISK_REFERENCE_TOOL: ${{ github.workspace }}/build/ci/quantrisk_reference_tool
        run: |
          uv run --no-build --no-sync python -c "import scipy, QuantLib; print('Independent oracles loaded')"
          uv run --no-build --no-sync python -m pytest -q \
            tests/python/test_smoke.py \
            tests/python/test_pricing.py \
            tests/python/test_cpp_python_consistency.py \
            tests/python/test_pricing_vs_quantlib.py \
            tests/python/test_validation_errors.py

  benchmark-suite:
    # The published artifacts in benchmarks/ and experiments/ are the evidence the README
    # and docs/validation_matrix.md quote. This job re-executes all nineteen members against
    # live oracles so that evidence cannot rot into something nothing runs.
    #
    # --require-all is the load-bearing flag. Without it a missing oracle would mark members
    # SKIPPED and the suite would still exit 0, turning "we measured everything" into a job
    # that passes by measuring nothing.
    name: Benchmark suite against live oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install with the validation oracles
        run: uv sync --extra oracles
      - name: Configure (CMake preset ci)
        run: uv run cmake --preset ci
      - name: Build core and bindings
        run: uv run cmake --build --preset ci
      - name: Install the Python package from the same tree
        run: uv pip install -e .
      - name: Run every benchmark and experiment
        run: uv run python -m tools.run_benchmark_suite --require-all
      - name: Show the generated summary
        run: cat benchmarks/suite/results/suite_summary.md
      - name: Upload the suite artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-suite
          path: benchmarks/suite/results/
          if-no-files-found: error
